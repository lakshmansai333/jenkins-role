    # ------------------------------
    # Health Checks
    # ------------------------------

    - name: Wait for Jenkins port to be open
      wait_for:
        host: 127.0.0.1
        port: "{{ jenkins_port }}"
        timeout: 60
        state: started

    - name: Verify Jenkins API endpoint is responding
      uri:
        url: "http://127.0.0.1:{{ jenkins_port }}/api/json"
        status_code: [200 ,403]
        return_content: yes
      register: jenkins_api
      retries: 5
      delay: 5
      until: jenkins_api.status in [ 200, 403 ]

    - name: Display Jenkins health check response
      debug:
        msg: "Jenkins API responded successfully."

    # ------------------------------
    # Show initial admin password
    # ------------------------------

    - name: Read initial admin password
      slurp:
        src: /var/lib/jenkins/secrets/initialAdminPassword
      register: admin_pw
      ignore_errors: yes

    - name: Show decoded initial admin password
      when: admin_pw.content is defined
      debug:
        msg: "Initial Admin Password: {{ admin_pw.content | b64decode }}"
