---
# tasks file for jenkins


 # ------------------------------
    # Setup Repos & Packages
    # ------------------------------

    - name: Download Jenkins repo file
      get_url:
        url: "{{ jenkins_repo_url }}"
        dest: /etc/yum.repos.d/jenkins.repo
        mode: '0644'
      notify: Reload repo cache

    - name: Import Jenkins GPG key
      rpm_key:
        state: present
        key: "{{ jenkins_gpg_key_url }}"

    - name: Install Java
      yum:
        name: "{{ java_package }}"
        state: present

    - name: Install / upgrade Jenkins
      yum:
        name: "{{ jenkins_package }}"
        state: latest
      register: jenkins_install
      notify: Restart Jenkins

    # - name: Deploy Jenkins sysconfig template
      # template:
      #   src: "{{ jenkins_sysconfig_src }}"
      #   dest: "{{ jenkins_sysconfig_dest }}"
      # register: sysconfig_template
      # notify: Restart Jenkins

    - name: Enable and start Jenkins service
      systemd:
        name: "{{ jenkins_service }}"
        enabled: yes
        state: started

    # ------------------------------
    # Backup & Optional Restore
    # ------------------------------

    - name: Ensure backup directory exists
      when: enable_backup
      file:
        path: "{{ jenkins_backup_dir }}"    #"/opt/jenkins_backup"
        state: directory

    - name: Backup Jenkins home directory
      when: enable_backup
      archive:
        path: "{{ jenkins_home }}"
        dest: "{{ jenkins_backup_dir }}/{{ backup_filename }}"
        format: gz

    - name: Restore Jenkins home directory (manual trigger only)
      when: enable_restore
      unarchive:
        src: "{{ jenkins_backup_dir }}/{{ backup_filename }}"
        dest: "{{ jenkins_home }}"
        remote_src: yes
      notify: Restart Jenkins

